{% load learning_filters %}
<div class="rd-card units-card">
  <div class="units-card__hd">
    <div>
      <h3 class="units-card__title d-inline">{{ resource.resource_type.unit_label }}s</h3>
      <span class="units-card__count">
        {{ completed_units }} of {{ total_units }} complete
      </span>
    </div>
    {% if perms.learning.add_learningunit %}
    <button class="rdbtn rdbtn--primary rdbtn--sm" data-bs-toggle="modal" data-bs-target="#addUnitModal" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14"></path>
      </svg>
      Add {{ resource.resource_type.unit_label|lower }}
    </button>
    {% endif %}
  </div>

  <ul id="unit-list" class="ulist">
    {# Populated by JavaScript in resource_detail.html #}
  </ul>
</div>
