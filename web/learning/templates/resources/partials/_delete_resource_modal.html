{# ── Delete resource modal ───────────────────────────────────────────────────── #}
<div class="modal fade modal--rd" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" style="color:var(--rose)">
            <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
          </svg>
          Delete resource
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p style="color:var(--ink-soft);margin:0 0 8px">Are you sure you want to delete <strong style="color:var(--ink)">{{ resource.title }}</strong>?</p>
        <p style="color:var(--rose);margin:0;font-size:.875rem;display:flex;align-items:center;gap:6px">
          <svg style="width:14px;height:14px;flex-shrink:0" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.3 3.3 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.3a2 2 0 0 0-3.4 0z"></path>
            <path d="M12 9v4M12 17h.01"></path>
          </svg>
          This will also delete all {{ total_units }} learning unit{{ total_units|pluralize }}.
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="rdbtn rdbtn--ghost" data-bs-dismiss="modal">Cancel</button>
        <form method="post" action="{% url 'learning:resource_delete' resource.pk %}">
          {% csrf_token %}
          <button type="submit" class="rdbtn rdbtn--danger">
            <span class="btn-text">Delete resource</span>
            <span class="spinner-border spinner-border-sm d-none"></span>
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
