{# ── Reschedule modal ────────────────────────────────────────────────────────── #}
<div class="modal fade modal--rd" id="sessReschedModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" style="max-width:420px">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path>
          </svg>
          Reschedule session
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="sfield">
          <div class="modal-field-label">Session</div>
          <p id="sessReschedTitle" class="sresched-title"></p>
        </div>
        <div class="sfield" style="margin-top:18px">
          <div class="modal-field-label">New date</div>
          <input type="date" class="modal-input" id="sessReschedDate">
          <p class="modal-field-hint">Pick a new date for this planned session.</p>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="rdbtn rdbtn--ghost rdbtn--sm"
                data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="rdbtn rdbtn--primary rdbtn--sm"
                id="sessReschedSave">Reschedule</button>
      </div>
    </div>
  </div>
</div>
