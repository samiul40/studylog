{# ── Session edit modal ──────────────────────────────────────────────────────── #}
<div class="modal fade modal--rd" id="sessEditModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <div class="sess-mhd">
          <div class="sess-titlerow" id="sessMHTitleRow">
            <h5 class="sess-mhd__title" id="sessMHTitle">Edit session</h5>
            <button class="sess-editbtn" id="sessMHEditBtn" type="button" title="Edit session name">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path>
              </svg>
            </button>
          </div>
          <input class="sess-titleinput" id="sessMHTitleInput" type="text"
                 placeholder="Name this session" maxlength="255" hidden>
          <div class="sess-mhd__sub" id="sessMHSub" hidden></div>
          <div class="sess-mhd__date" id="sessMHDate"></div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal"
                aria-label="Close"></button>
      </div>

      <div class="modal-body" style="display:flex;flex-direction:column;gap:20px;padding:20px 22px;">
        {% include "sessions/partials/_sess_edit_body.html" %}
      </div>

      <div class="modal-footer">
        <button type="button" class="rdbtn rdbtn--danger rdbtn--sm" id="sessDeleteBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
          </svg>
          Delete
        </button>
        <div style="flex:1"></div>
        <button type="button" class="rdbtn rdbtn--ghost rdbtn--sm"
                data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="rdbtn rdbtn--primary rdbtn--sm"
                id="sessSaveBtn">Save changes</button>
      </div>
    </div>
  </div>
</div>
