upstream django {
    server web:8000;
}

# Trust Cloudflare edge IPs and use the real client IP for rate limiting.
# Without this, $binary_remote_addr is a Cloudflare IP and per-IP limits are useless.
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
real_ip_header CF-Connecting-IP;

# Rate limiting zones — defined at http level (outside server blocks)
# per_ip: cap each individual IP to 20 req/s (burst of 40 queued before 429)
# global: cap total site throughput to 300 req/s (protects the droplet as a whole)
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;
limit_req_zone $server_name zone=global:1m rate=300r/s;

# Connection limiting — max concurrent connections per IP
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# Step 1 (initial cert acquisition): HTTP only — comment out the 443 block below,
# run: docker compose -f docker-compose-prod.yml run --rm certbot certonly
#        --webroot --webroot-path /var/www/certbot -d YOUR_DOMAIN -d www.YOUR_DOMAIN
# Step 2: uncomment the 443 block and replace YOUR_DOMAIN, then restart nginx.

server {
    listen 80;
    server_name studylog.co.uk www.studylog.co.uk;

    # Required for Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.studylog.co.uk$request_uri;
    }
}

# Redirect non-www to www over HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name studylog.co.uk;

    ssl_certificate /etc/letsencrypt/live/studylog.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studylog.co.uk/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://www.studylog.co.uk$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.studylog.co.uk;

    ssl_certificate /etc/letsencrypt/live/studylog.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studylog.co.uk/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS — tell browsers to always use HTTPS for the next year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10M;

    # Timeout tuning — drop slow/idle connections before they pile up
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 65s;  # longer under HTTP/2 — streams share one connection
    send_timeout 10s;

    location ~* /\.env {
        deny all;
        return 404;
    }

    location / {
        # Apply rate limits — nodelay means excess requests get 429 immediately,
        # not queued, so a burst won't stall worker slots waiting to drain
        limit_req zone=per_ip burst=40 nodelay;
        limit_req zone=global burst=100 nodelay;
        limit_req_status 429;

        # Max 30 concurrent connections per IP
        limit_conn conn_per_ip 30;
        limit_conn_status 429;

        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
